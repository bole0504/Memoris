# Memoris — nginx site. Cloudflare terminates TLS in front; this listens on :80.
# Static dashboard served directly; /health and /v1/* proxied to the Node gateway.

server {
    listen 80;
    server_name _;

    # Dashboard — prebuilt static SPA.
    root /opt/memoris/dashboard;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gateway — health + API.
    location ~ ^/(health|v1/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Small box: keep upload/buffer limits modest.
    client_max_body_size 1m;
}
